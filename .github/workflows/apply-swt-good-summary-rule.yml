name: Apply SWT good summary rule

on:
  push:
    branches:
      - agent/swt-good-summary-rule
    paths:
      - .github/workflows/apply-swt-good-summary-rule.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/swt-good-summary-rule
          fetch-depth: 0

      - name: Apply exact scoring patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('server.js')
          text = path.read_text()

          replacements = [
              (
                  """// Convert diagnostic checklist coverage into the holistic 0–4 Content trait.\n// A central message plus three of four headline ideas is full content: one\n// secondary point may be omitted, matching the Pearson calibration responses.\nfunction coverageToContentScore(capturedCount, totalIdeas, centralCaptured) {\n  if (!totalIdeas || capturedCount <= 0) return 0;\n  const ratio = capturedCount / totalIdeas;\n  if (centralCaptured && ratio >= 0.75) return 4;\n  if (ratio >= 0.75) return 3;\n  if (centralCaptured && ratio >= 0.50) return 3;\n  if (ratio >= 0.50) return 2;\n  return centralCaptured ? 2 : 1;\n}\n""",
                  """// Convert diagnostic checklist coverage into the holistic 0–4 Content trait.\n// Full content means the central message plus at least two important supporting\n// ideas; diagnostic key elements are guidance, not compulsory boxes.\nfunction coverageToContentScore(capturedCount, totalIdeas, centralCaptured) {\n  if (!totalIdeas || capturedCount <= 0) return 0;\n  const ratio = capturedCount / totalIdeas;\n  if (centralCaptured && capturedCount >= 3) return 4;\n  if (ratio >= 0.75) return 3;\n  if (centralCaptured && ratio >= 0.50) return 3;\n  if (ratio >= 0.50) return 2;\n  return centralCaptured ? 2 : 1;\n}\n"""
              ),
              (
                  """AUTHORITATIVE SCORING CRITERIA:\n- These criteria determine the score; the diagnostic checklist is coaching only.\n- A summary may earn full Content even when it omits one secondary point.\n- Award Content 4/4 when it conveys the central message accurately and combines at least two important supporting ideas, with no major contradiction or fabrication.\n- Source wording and phrase-lifting are acceptable. Do not require a fixed number of synonyms.\n- A semicolon plus “moreover/however/therefore” is only one valid structure. Do not penalise a clear sentence merely because it uses and, but, because, while, which, or another grammatical structure.\n- Minor local grammar errors or a spelling mistake may remain in an otherwise clear high-scoring summary. Judge whether communication remains controlled and understandable.\n\nCONTENT SCORE (integer 0–4):\n4 = central message + at least two important supporting ideas; concise, accurate and faithful; one secondary omission is acceptable.\n""",
                  """AUTHORITATIVE SCORING CRITERIA:\n- These criteria determine the score; the diagnostic checklist is coaching only.\n- GOOD SUMMARY RULE: treat the response as good/high-scoring when it accurately identifies the main topic or central message and includes at least two important supporting ideas (normally 2–3).\n- The ideas must be logically connected. Strong or adequate cohesion is acceptable; weak/disconnected writing is not a good summary.\n- Minor grammar or spelling errors are acceptable when they do not hinder comprehension.\n- The summary should be selective: omit examples, minor facts, repetitions and other extraneous details. A small incidental nonessential detail does not by itself disqualify an otherwise concise and clear summary.\n- Do NOT require every diagnostic headline idea. A summary may earn full Content when the central message plus at least two important supporting ideas are present, even if another secondary diagnostic point is omitted.\n- Source wording and phrase-lifting are acceptable. Do not require a fixed number of synonyms.\n- A semicolon plus “moreover/however/therefore” is only one valid structure. Do not penalise a clear sentence merely because it uses and, but, because, while, which, or another grammatical structure.\n\nCONTENT SCORE (integer 0–4):\n4 = central message + at least two important supporting ideas; concise, accurate, faithful and selective; one secondary omission is acceptable.\n"""
              ),
              (
                  """      // Calibration safeguard: 3/4 headline ideas including the central message\n      // is full content, even when one secondary point is omitted.\n""",
                  """      // Calibration safeguard: the central message plus at least two supporting\n      // ideas is full content, even when another diagnostic point is omitted.\n"""
              )
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

      - name: Validate patch
        run: |
          node --check server.js
          grep -F "GOOD SUMMARY RULE" server.js
          grep -F "centralCaptured && capturedCount >= 3" server.js
          git diff --check

      - name: Commit scoring change and remove temporary workflow
        run: |
          rm .github/workflows/apply-swt-good-summary-rule.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js .github/workflows/apply-swt-good-summary-rule.yml
          git diff --cached --check
          git commit -m "Clarify SWT good summary scoring"
          git push origin HEAD:agent/swt-good-summary-rule
