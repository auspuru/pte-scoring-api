name: Generate writing audio bundle
on:
  push:
    branches:
      - fix/writing-sectional-audio-layout-20260924

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/writing-sectional-audio-layout-20260924
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install audio tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install edge-tts==7.2.8
      - name: Generate and normalize recordings
        run: python scripts/generate-writing-audio.py
      - name: Commit audio bundle
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/writing-audio
          if git diff --cached --quiet; then
            echo "Audio bundle already current."
            exit 0
          fi
          git commit -m "Bundle neural writing prediction audio"
          git push origin HEAD:fix/writing-sectional-audio-layout-20260924
