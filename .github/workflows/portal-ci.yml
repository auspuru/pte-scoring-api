name: Portal CI
on:
  push:
    branches:
      - main
      - portal-accessibility-20260924
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install media build tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak
      - run: npm ci
      - run: npm test
      - run: npm run build
