name: Portal CI
on:
  push:
    branches:
      - main
      - portal-accessibility-20260924
  pull_request:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: full_mock_test
          POSTGRES_USER: full_mock_test
          POSTGRES_PASSWORD: full_mock_test
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U full_mock_test -d full_mock_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install media build tools
        run: |
          # The hosted Azure mirror can stall before tests start. Keep the
          # signed Ubuntu archive and bound network retries within the job budget.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i 's|http://azure.archive.ubuntu.com/ubuntu|https://archive.ubuntu.com/ubuntu|g' /etc/apt/apt-mirrors.txt
          fi
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg espeak python3-venv
      - run: npm ci
      - name: Verify essay guide browser flow
        env:
          FULL_MOCK_TEST_CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/verify-essay-guide-browser.js
      - name: Verify production release
        env:
          FULL_MOCK_TEST_DATABASE_URL: postgresql://full_mock_test:full_mock_test@127.0.0.1:5432/full_mock_test
          FULL_MOCK_TEST_CHROME_PATH: /usr/bin/google-chrome
        run: node scripts/verify-full-mock-systems.js --evidence-out .cache/full-mock-validation.json
      - name: Save Full Mock validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-mock-validation
          path: |
            .cache/full-mock-validation.json
            .cache/essay-guide-*.png
            .cache/swt-review-*.png
            public/index.min.js
          include-hidden-files: true
          if-no-files-found: error
