name: Temporary Writing Lab Audit

on:
  push:
    branches:
      - fix/writing-lab-unified-audit

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
