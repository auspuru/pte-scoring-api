name: Production Visual QA
# rerun after mobile sidebar flow fix f2e2370

on:
  push:
    branches:
      - qa/production-visual-20260928

permissions:
  contents: read

jobs:
  visual-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install media build tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak python3-venv
      - run: npm ci
      - name: Run production browser QA
        env:
          QA_URL: https://swt.up.railway.app/
        run: node scripts/production-visual-qa.js
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-visual-qa
          path: visual-qa-output
          retention-days: 7
