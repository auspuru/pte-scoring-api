[build]
builder = "NIXPACKS"
buildCommand = "node scripts/verify-release.js"

[deploy]
healthcheckPath = "/api/ready"
healthcheckTimeout = 120
drainingSeconds = 60
startCommand = "node server.js"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[volumes]]
mount = "/app/data"
name = "pte-data"
