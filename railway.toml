[build]
builder = "NIXPACKS"
buildCommand = "npm run prepare:railway"

[deploy]
healthcheckPath = "/api/ready"
healthcheckTimeout = 120
drainingSeconds = 60
startCommand = '''sh -c 'case "$PTE_DB_CUTOVER_PHASE" in maintenance-????-??-??) exec node scripts/db-cutover-maintenance.js ;; *) exec node server.js ;; esac' '''
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3

[[volumes]]
mount = "/app/data"
name = "pte-data"
