<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Essay feedback review · IPT Brisbane</title><link rel="stylesheet" href="/essay-next-steps.css?v=20261015-1"><style>
:root{--ink:#172c45;--ink-soft:#526477;--line:#d6dfeb;--accent:#174ea6;--bg-card:#fff;--bg-input:#fff}*{box-sizing:border-box}body{margin:0;background:#edf2f8;color:var(--ink);font:16px/1.6 system-ui,sans-serif}header,.controls{max-width:1080px;margin:auto;padding:24px}header{padding-bottom:0}.eyebrow{color:#174ea6;font-size:13px;letter-spacing:.1em;font-weight:750;text-transform:uppercase}h1{font:700 clamp(25px,4vw,36px)/1.2 Georgia,serif;margin:10px 0}button,select{font:inherit;padding:9px 14px;border:1px solid #b8c8dc;border-radius:8px;color:var(--ink);background:white}button{cursor:pointer}button[aria-pressed=true]{background:#174ea6;color:#fff}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}select{max-width:100%}iframe{display:block;width:min(1080px,calc(100% - 32px));height:900px;margin:0 auto 32px;border:1px solid #d6dfeb;border-radius:12px;background:white}iframe.mobile{width:min(390px,calc(100% - 24px));height:800px}.report{max-width:980px;margin:auto;padding:clamp(18px,4vw,36px);background:#fff}h2{font:700 24px Georgia,serif}.score{font-size:28px;font-weight:750;color:#174ea6}.question{border-bottom:1px solid #d6dfeb;padding-bottom:18px}.muted{color:#526477}details{margin:12px 0}summary{cursor:pointer}button:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid #174ea6;outline-offset:3px}.trait{border-top:1px solid #d6dfeb;padding:12px 0}.trait h4{margin:0;text-transform:capitalize}.source{white-space:pre-wrap;overflow-wrap:anywhere}.notice{font-size:14px;color:#526477}.error{padding:24px;color:#a32020}
</style><script src="/essay-feedback.js?v=sha256-8c063b863222" defer></script><script src="/essay-next-steps.js?v=sha256-f99c9220aec6" defer></script></head><body><div id="app"></div><script>
document.addEventListener('DOMContentLoaded',async()=>{
 const app=document.getElementById('app'),params=new URLSearchParams(location.search);
 try{
  const res=await fetch('/essay-feedback-preview.json',{cache:'no-store'});if(!res.ok)throw Error('The review examples are being prepared.');const data=await res.json(),records=data.examples;
  if(!records.length)throw Error('No review examples are available.');
  const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  if(params.get('embed')==='1'){
   const record=records[Math.max(0,Math.min(records.length-1,Number(params.get('case'))||0))],a=record.assessment;
   app.innerHTML='<main class="report"><p class="eyebrow">IPT Brisbane · Essay review</p><h2>'+escape(record.title)+'</h2><p class="notice">Synthetic test essay with real assessment feedback. No student records are used.</p><p class="score">'+escape(a.scores.total)+' / 26 <small style="font-size:14px;font-weight:400">practice rubric</small></p><p class="question"><strong>Question</strong><br>'+escape(a.questionText)+'</p>'+EssayFeedback.render(a)+(EssayNextSteps.render(a)||'')+'<details><summary>Score breakdown and feedback</summary>'+Object.keys(a.feedback||{}).map(k=>'<div class="trait"><h4>'+escape(k)+' · '+escape(a.diagnosticScores?.[k]??a.scores[k])+'</h4><p>'+escape(a.feedback[k])+'</p></div>').join('')+'</details><details><summary>Read the complete test essay</summary><div class="source">'+escape(a.essayText)+'</div></details></main>';
   return;
  }
  app.innerHTML='<header><p class="eyebrow">IPT Brisbane</p><h1>Review the new essay feedback</h1><p>Explore the assessment examples and inspect the exact passages behind each correction.</p><p class="notice">These are synthetic evaluation essays. This page does not submit writing or change student attempts. Teaching review is required before wider release.</p></header><nav class="controls" aria-label="Preview controls"><label>Example <select id="example">'+records.map((r,i)=>'<option value="'+i+'">'+escape(r.title)+'</option>').join('')+'</select></label><button id="desktop" aria-pressed="true">Desktop view</button><button id="mobile" aria-pressed="false">Mobile view</button></nav><iframe id="preview" title="Essay feedback example" src="/essay-feedback-preview.html?embed=1&case=0"></iframe>';
  const frame=document.getElementById('preview');document.getElementById('example').addEventListener('change',e=>{frame.src='/essay-feedback-preview.html?embed=1&case='+e.target.value;});
  for(const mode of ['desktop','mobile'])document.getElementById(mode).addEventListener('click',()=>{frame.classList.toggle('mobile',mode==='mobile');for(const m of ['desktop','mobile'])document.getElementById(m).setAttribute('aria-pressed',String(m===mode));});
 }catch(e){app.innerHTML='<p class="error"></p>';app.firstChild.textContent=e.message;}
});
</script></body></html>
