<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" role="img" aria-label="Personal AI Assistant">
  <defs>
    <linearGradient id="shell" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2D6CA5"/>
      <stop offset="1" stop-color="#173B63"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#E9F2FA"/>
    </linearGradient>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#173B63" flood-opacity=".22"/>
    </filter>
  </defs>
  <style>
    .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s ease-in-out infinite}
    .eye.e2{animation-delay:.05s}
    .antenna{animation:pulse 2.2s ease-in-out infinite}
    .spark{transform-box:fill-box;transform-origin:center;animation:twinkle 2.8s ease-in-out infinite}
    .spark.s2{animation-delay:.8s}.spark.s3{animation-delay:1.4s}
    @keyframes blink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.12)}}
    @keyframes pulse{0%,100%{opacity:.72;transform:scale(.9)}50%{opacity:1;transform:scale(1.12)}}
    @keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.25)}}
  </style>

  <g filter="url(#shadow)">
    <circle cx="80" cy="80" r="62" fill="rgba(255,255,255,.62)" stroke="rgba(255,255,255,.9)" stroke-width="2"/>
    <path d="M80 24v-9" stroke="#173B63" stroke-width="5" stroke-linecap="round"/>
    <circle class="antenna" cx="80" cy="12" r="6" fill="#C53030" stroke="#fff" stroke-width="2"/>

    <rect x="34" y="36" width="92" height="80" rx="28" fill="url(#shell)" stroke="#12334F" stroke-width="4"/>
    <rect x="45" y="49" width="70" height="49" rx="20" fill="url(#screen)" stroke="#fff" stroke-width="2"/>

    <rect class="eye e1" x="59" y="65" width="12" height="10" rx="5" fill="#2D6CA5"/>
    <rect class="eye e2" x="89" y="65" width="12" height="10" rx="5" fill="#2D6CA5"/>
    <path d="M64 85c8 7 24 7 32 0" fill="none" stroke="#C53030" stroke-width="5" stroke-linecap="round"/>

    <circle cx="35" cy="74" r="9" fill="#C53030" stroke="#fff" stroke-width="3"/>
    <circle cx="125" cy="74" r="9" fill="#C53030" stroke="#fff" stroke-width="3"/>

    <path d="M52 114c8 8 17 12 28 12s20-4 28-12" fill="none" stroke="#173B63" stroke-width="6" stroke-linecap="round"/>
    <path d="M52 112l-12 13" stroke="#2D6CA5" stroke-width="7" stroke-linecap="round"/>
    <path d="M108 112l12 13" stroke="#2D6CA5" stroke-width="7" stroke-linecap="round"/>
  </g>

  <path class="spark s1" d="M28 42l2.4 5 5.4.8-3.9 3.8.9 5.4-4.8-2.5-4.8 2.5.9-5.4-3.9-3.8 5.4-.8Z" fill="#C53030"/>
  <path class="spark s2" d="M132 44l2 4.2 4.6.7-3.3 3.2.8 4.6-4.1-2.1-4.1 2.1.8-4.6-3.3-3.2 4.6-.7Z" fill="#2D6CA5"/>
  <circle class="spark s3" cx="130" cy="113" r="5" fill="#22C58B"/>
</svg>