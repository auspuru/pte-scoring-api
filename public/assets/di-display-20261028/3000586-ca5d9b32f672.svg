<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="chart-title chart-desc" data-source-sha256="4e9c530bedfe3fa99c368784c05b842674064cc5de4d7c16489b5775d3e11f48"><title id="chart-title">Average rainfall in millimetres</title><desc id="chart-desc">The grouped bars compare average rainfall in millimetres in the United Kingdom, Japan and Australia across spring, summer, autumn and winter. The United Kingdom is highest and Australia lowest in every season. The UK values are 5.3, 4.5, 3.5 and 1.5 millimetres respectively. Japan records 2.4, 3.4, 1.8 and 1.2 millimetres, while Australia records 2, 2, 1.5 and 1 millimetre. Winter is the lowest season for all three countries; Japan peaks in summer and the UK in spring.</desc><rect width="1200" height="800" fill="#fff"/><g font-family="Arial, sans-serif" fill="#18334c"><text x="50" y="57" text-anchor="start" font-size="31" font-weight="700">Average rainfall in millimetres</text><text x="50" y="96" text-anchor="start" font-size="21" >millimetres</text><path d="M100 615H1140" stroke="#dfe6ec"/><text x="82" y="622" text-anchor="end" font-size="20" >0</text><path d="M100 530H1140" stroke="#dfe6ec"/><text x="82" y="537" text-anchor="end" font-size="20" >1.2</text><path d="M100 445H1140" stroke="#dfe6ec"/><text x="82" y="452" text-anchor="end" font-size="20" >2.4</text><path d="M100 360H1140" stroke="#dfe6ec"/><text x="82" y="367" text-anchor="end" font-size="20" >3.6</text><path d="M100 275.00000000000006H1140" stroke="#dfe6ec"/><text x="82" y="282.00000000000006" text-anchor="end" font-size="20" >4.8</text><path d="M100 190H1140" stroke="#dfe6ec"/><text x="82" y="197" text-anchor="end" font-size="20" >6</text><rect data-category="Spring" data-series="UK" data-value="5.3" data-scale="70.83333333333333" x="114" y="239.58333333333337" width="69.33333333333333" height="375.41666666666663" fill="#2865ad"/><text x="148.66666666666666" y="227.58333333333337" text-anchor="middle" font-size="22" >5.