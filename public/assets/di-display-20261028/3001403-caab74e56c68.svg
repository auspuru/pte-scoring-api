<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="chart-title chart-desc" data-source-sha256="f47aab7600764bfceaceefe6e2c9e8ef7f631f63dad66264ef53920f3470e623"><title id="chart-title">Foreign Language Motivation</title><desc id="chart-desc">The chart shows why students choose to study foreign languages, with each reason measured as a percentage of students. Personal interest or enjoyment is the largest reason at 43 percent, followed by degree requirements at 24 percent and use in a future career at 13 percent. Future travel or study abroad accounts for 9 percent, family background for 6 percent, and application for an advanced degree for 3 percent. Societal responsibility and other reasons are tied for the smallest share at 1 percent each.</desc><rect width="1200" height="800" fill="#fff"/><g font-family="Arial, sans-serif" fill="#18334c"><text x="50" y="57" text-anchor="start" font-size="31" font-weight="700">Foreign Language Motivation</text><text x="50" y="96" text-anchor="start" font-size="21" >percent</text><path data-category="Personal interest or enjoyment" data-value="43" data-total="100" d="M300 405L300 175A230 230 0 0 1 397.92923705996674 613.1102220671845Z" fill="#2865ad" stroke="#fff" stroke-width="3"/><rect x="600" y="137" width="23" height="23" rx="3" fill="#2865ad"/><text x="640" y="155" text-anchor="start" font-size="22" >Personal interest or enjoyment</text><text x="1145" y="155" text-anchor="end" font-size="27" font-weight="700">43%</text><path data-category="Degree requirements" data-value="24" data-total="100" d="M300 405L397.92923705996674 613.1102220671845A230 230 0 0 1 98.4494635899114 515.8033450433945Z" fill="#cd7722" stroke="#fff" stroke-width="3"/><rect x="600" y="213" width="23" height="23" rx="3" fill="#cd7722"/><text x="640" y="231" text-anchor="start" font-size="22" >Degree requirements</text><text x="1145" y="231" text-anchor="end" font-size="27" font-weight="700">24%</text><path data-category=