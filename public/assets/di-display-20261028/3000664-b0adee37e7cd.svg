<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="chart-title chart-desc" data-source-sha256="0c1250275aa69d1cce4612d170a42fbe9ec6d44cd7bf169fec3ef624fc2dafcd"><title id="chart-title">Texts sent on a typical day</title><desc id="chart-desc">The grouped bars compare adults and teenagers who text by the number of texts sent on a typical day, measured as percentages. Adults most commonly send 1 to 10 texts, at 51 percent, compared with 22 percent of teenagers. The no-text category has 9 percent of adults and 2 percent of teenagers. For 11 to 20 texts the shares are 13 percent for adults and 11 percent for teenagers; for 21 to 50 they are 13 and 18 percent; for 51 to 100 they are 7 and 18 percent. Teenagers are most common in the 101-plus category, at 29 percent compared with 8 percent for adults. Use the printed percentages without rescaling them.</desc><rect width="1200" height="800" fill="#fff"/><g font-family="Arial, sans-serif" fill="#18334c"><text x="50" y="57" text-anchor="start" font-size="31" font-weight="700">Texts sent on a typical day</text><text x="50" y="96" text-anchor="start" font-size="21" >percent</text><path d="M100 615H1140" stroke="#dfe6ec"/><text x="82" y="622" text-anchor="end" font-size="20" >0</text><path d="M100 530H1140" stroke="#dfe6ec"/><text x="82" y="537" text-anchor="end" font-size="20" >12</text><path d="M100 445H1140" stroke="#dfe6ec"/><text x="82" y="452" text-anchor="end" font-size="20" >24</text><path d="M100 360H1140" stroke="#dfe6ec"/><text x="82" y="367" text-anchor="end" font-size="20" >36</text><path d="M100 275H1140" stroke="#dfe6ec"/><text x="82" y="282" text-anchor="end" font-size="20" >48</text><path d="M100 190H1140" stroke="#dfe6ec"/><text x="82" y="197" text-anchor="end" font-size="20" >60</text><rect data-category="None" data-series="Adults" data-value="9" data-scale="7.083333333333333" x="114.00000000000001" y="551.25" width="64.66666666666667" height="63.75" fill="#2865ad"/><tex