<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1560 820" role="img" aria-labelledby="chart-title chart-desc" data-source-sha256="9eba90fd6e8cb94d6cb572754ea61d4247158375ddbc47489afcf33ba0213cbe"><title id="chart-title">International student funding, U.S.</title><desc id="chart-desc">The table compares primary funding sources for international students in the United States in 2003/04 and 2013/14, showing student counts, shares and percentage changes. Personal and family funding remains the largest source: 385543 students and 67 percent in 2003/04, rising to 574129 students and 65 percent in 2013/14, a 49 percent increase in count. The total rises from 572509 to 886052 students, a 55 percent increase. U.S. college or university funding rises from 134015 students and 23 percent to 171218 and 19 percent, a 28 percent increase. Foreign government or university funding rises from 13699 students and 2 percent to 66147 and 7 percent, a 383 percent increase. Current employer funding rises from 10111 and 2 percent to 49503 and 6 percent, a 390 percent increase. Other sources fall from 29141 and 5 percent to 25055 and 3 percent, a 14 percent decline.</desc><rect width="1560" height="820" fill="#fff"/><g font-family="Arial, sans-serif" fill="#18334c"><text x="50" y="57" text-anchor="start" font-size="31" font-weight="700">International student funding, U.S.</text><text x="50" y="96" text-anchor="start" font-size="21" >2003/04 to 2013/14 · student counts and shares</text><rect x="45" y="200" width="1430" height="82" fill="#e7eff8"/><text x="61" y="246" text-anchor="start" font-size="24" >Primary funding source</text><text x="552.5" y="231" text-anchor="middle" font-size="22" >2003/04</text><text x="552.5" y="261" text-anchor="middle" font-size="22" >students</text><text x="757.5" y="231" text-anchor="middle" font-size="22" >2003/04 %</text><text x="962.5" y="231" text-anchor="middle" font-size="22" >2013/14</text><text x="962.5" y="261" text-anchor="middle" font-size="22" 