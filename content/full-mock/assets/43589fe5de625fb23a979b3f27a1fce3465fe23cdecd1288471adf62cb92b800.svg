<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="chart-title chart-desc" data-source-sha256="a27805eb504980e59e4c2ddf0df3394a884e3ac48bc88627b90f97af20de1dc0"><title id="chart-title">Pet Household Owners</title><desc id="chart-desc">The pie chart shows the number of households in millions who own each type of pet, alongside each displayed percentage. Dogs are largest at 69 million and 45 percent, followed by cats at 45.3 million and 29 percent. Freshwater fish account for 11.8 million and 8 percent, and birds for 9.9 million and 6 percent. Horses account for 3.5 million and 2 percent, saltwater fish 2.9 million and 2 percent, reptiles 5.7 million and 4 percent, and small animals 6.2 million and 4 percent. The smallest household count is saltwater fish; horses and saltwater fish tie at 2 percent.</desc><rect width="1200" height="800" fill="#fff"/><g font-family="Arial, sans-serif" fill="#18334c"><text x="50" y="57" text-anchor="start" font-size="31" font-weight="700">Pet Household Owners</text><text x="50" y="96" text-anchor="start" font-size="21" >percent</text><path data-category="Bird" data-value="6" data-total="100" d="M300 405L300 175A230 230 0 0 1 384.668647117476 191.15140824570219Z" fill="#2865ad" stroke="#fff" stroke-width="3"/><rect x="600" y="137" width="23" height="23" rx="3" fill="#2865ad"/><text x="640" y="155" text-anchor="start" font-size="22" >Bird</text><text x="1145" y="155" text-anchor="end" font-size="27" font-weight="700">6%</text><text x="1145" y="181" text-anchor="end" font-size="18" >9.9 million households</text><path data-category="Cat" data-value="29" data-total="100" d="M300 405L384.668647117476 191.15140824570219A230 230 0 0 1 486.07390870623794 540.1906080272688Z" fill="#cd7722" stroke="#fff" stroke-width="3"/><rect x="600" y="213" width="23" height="23" rx="3" fill="#cd7722"/><text x="640" y="231" text-anchor="start" font-size="22" >Cat</text><text x="1145" y="231" text-anchor="end" font-size="2