<svg xmlns="http://www.w3.org/2000/svg" width="730" height="500" viewBox="0 0 730 500" role="img" aria-labelledby="title desc"><title id="title">Collecting rainwater for a garden</title><desc id="desc">A simple five-stage system. Original illustrative practice data.</desc><rect width="730" height="500" rx="16" fill="white"/><g fill="#203047" font-family="Arial,sans-serif"><text x="365" y="45" font-size="25" text-anchor="middle" font-weight="bold">Collecting rainwater for a garden</text><text x="365" y="77" font-size="16" text-anchor="middle">A simple five-stage system</text><rect x="155" y="111" width="420" height="44" rx="8" fill="#e6edf9" stroke="#bdd0e3"/><text x="365" y="139" font-size="18" text-anchor="middle">Rain falls on roof</text><path d="M365 156v13m-5-5 5 5 5-5" fill="none" stroke="#506380" stroke-width="2"/><rect x="155" y="176" width="420" height="44" rx="8" fill="#e8f3f0" stroke="#bdd0e3"/><text x="365" y="204" font-size="18" text-anchor="middle">Gutters collect runoff</text><path d="M365 221v13m-5-5 5 5 5-5" fill="none" stroke="#506380" stroke-width="2"/><rect x="155" y="241" width="420" height="44" rx="8" fill="#e6edf9" stroke="#bdd0e3"/><text x="365" y="269" font-size="18" text-anchor="middle">Filter removes debris</text><path d="M365 286v13m-5-5 5 5 5-5" fill="none" stroke="#506380" stroke-width="2"/><rect x="155" y="306" width="420" height="44" rx="8" fill="#e8f3f0" stroke="#bdd0e3"/><text x="365" y="334" font-size="18" text-anchor="middle">Tank stores water</text><path d="M365 351v13m-5-5 5 5 5-5" fill="none" stroke="#506380" stroke-width="2"/><rect x="155" y="371" width="420" height="44" rx="8" fill="#e6edf9" stroke="#bdd0e3"/><text x="365" y="399" font-size="18" text-anchor="middle">Pump supplies garden</text><text x="365" y="483" font-size="12" text-anchor="middle" fill="#627088">Illustrative data created for practice</text></g></svg>