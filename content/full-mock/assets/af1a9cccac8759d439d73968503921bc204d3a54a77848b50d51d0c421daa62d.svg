<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc">
  <title id="title">Average rainfall in inches</title>
  <desc id="desc">New York 47.25 inches, Dallas 33.70 inches, Phoenix 7.66 inches, Honolulu 22.02 inches. Vertical axis: 0 to 50 inches.</desc>
  <rect width="1100" height="720" fill="white"/>
  <g font-family="Arial, sans-serif" fill="#18314c">
    <text x="550" y="58" text-anchor="middle" font-size="34" font-weight="700">Average rainfall in inches</text>
    <g stroke="#dce4ef" stroke-width="2">
      <path d="M125 130H1030 M125 218H1030 M125 306H1030 M125 394H1030 M125 482H1030 M125 570H1030"/>
    </g>
    <g font-size="24" text-anchor="end">
      <text x="107" y="578">0</text><text x="107" y="490">10</text><text x="107" y="402">20</text>
      <text x="107" y="314">30</text><text x="107" y="226">40</text><text x="107" y="138">50</text>
    </g>
    <path d="M125 125V570H1030" fill="none" stroke="#52677d" stroke-width="2.5"/>
    <g data-axis-max="50" data-baseline="570" data-scale="8.8">
      <rect data-category="New York" data-value="47.25" x="177" y="154.2" width="145" height="415.8" fill="#a49caf"/>
      <rect data-category="Dallas" data-value="33.70" x="407" y="273.44" width="145" height="296.56" fill="#c896ab"/>
      <rect data-category="Phoenix" data-value="7.66" x="637" y="502.592" width="145" height="67.408" fill="#d2ac67"/>
      <rect data-category="Honolulu" data-value="22.02" x="867" y="376.224" width="145" height="193.776" fill="#a8b8a4"/>
    </g>
    <g font-size="28" text-anchor="middle" font-weight="700">
      <text x="249.5" y="142">47.25</text><text x="479.5" y="261">33.70</text>
      <text x="709.5" y="490">7.66</text><text x="939.5" y="364">22.02</text>
    </g>
    <g font-size="25" text-anchor="middle">
      <text x="249.5" y="612">New York</text><text x="479.5" y="612">Dallas</text>
      <text x="709.5" y="612">Phoenix</text><text x="939.5" y="612">Honolulu</text>
    </g>
    <text transform="translate(48 350) rotate(-90)" text-anchor="middle" font-size="24">Rainfall (inches)</text>
    <text x="577" y="676" text-anchor="middle" font-size="24">City</text>
  </g>
</svg>
